# Publication is an explicit action, never a side effect of pushing code.
# The checked-out request must enable publication and match the typed tag.
name: Publish firmware release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact enabled release/request.json tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: firmware-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish immutable firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          python3 release/publish.py --execute --confirm-tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
