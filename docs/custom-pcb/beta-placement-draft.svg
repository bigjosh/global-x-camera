<text x="96.1" y="70.48" font-size="1.45" text-anchor="middle" fill="#333">First draft for mark-up. Locked: the control group. From the user: lens, SD slot, tripod and right-edge keep-outs. Everything else is proposed.</text>
<text x="96.1" y="73.08" font-size="1.45" text-anchor="middle" fill="#333">Composition: SD slot, lens and cell share the horizontal centre line; MCU, lens and the regulator block share the lens axis; the four FETs sit centred under the LED.</text>
<text x="96.1" y="75.68" font-size="1.45" text-anchor="middle" fill="#333">Open: which way the camera flex leaves (it fixes portrait or landscape), the right-edge keep-out against the exposure dial, the tripod socket size, the unfolded protection board.</text>
