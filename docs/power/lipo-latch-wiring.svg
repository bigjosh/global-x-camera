<text x="1775" y="340.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#5d7080">Maintained SPDT; shown BAT</text>
<text x="1775" y="381.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#b13b35">Use break-before-make contacts.</text>
<text x="1775" y="417.96" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#5d7080">Actual installed switch type unverified.</text>
