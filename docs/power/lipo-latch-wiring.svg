<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2070" viewBox="0 0 2400 2070">
<title>Prototype wiring: manual USB/battery selector, SPDT trigger, A3 HOLD, exposure A0-A2 and ASA A4-A5</title>
<rect width="100%" height="100%" fill="white"/>
<text x="45" y="61.6" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700" fill="#1c3044">Prototype power and controls</text>
<text x="45" y="107.84" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#136b9b">Canonical wiring — November 10, 2026  |  SW2 manually selects USB or battery; Q3 removed</text>
<text x="45" y="152.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#b13b35">The PCB version will use automatic MOSFET source selection instead of SW2.</text>
<text x="45" y="191.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#5d7080">Installed Nov9 holds through USB. Nov10 USB HOLD-off correction is offline / not loaded; knob integration remains pending.</text>
<rect x="45" y="235" width="455" height="125" fill="#fff5f3" stroke="#b13b35" stroke-width="2"/>
<text x="65" y="273.84" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#b13b35">CN8 USB → board protection</text>
<text x="65" y="317.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#b13b35">TAP: SB12 pad 1</text>
<text x="65" y="351.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#b13b35">5V_USB_SNK; same net as CN9 pin 3</text>
<polyline points="500,300 610,300" fill="none" stroke="#b13b35" stroke-width="4"/>
<rect x="610" y="252" width="540" height="96" fill="#fff5f3" stroke="#b13b35" stroke-width="2"/>
<text x="632" y="290.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#b13b35">USB feed to selector</text>
<text x="632" y="328.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#5d7080">Existing D_USB may remain in series; see note.</text>
<polyline points="1150,300 1590,300 1590,410" fill="none" stroke="#b13b35" stroke-width="4"/>
<text x="1190" y="272.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#b13b35">USB</text>
<text x="45" y="406.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#5d7080">D_USB: the earlier plan used BAT20JFILM, anode at USB, cathode toward load.</text>
<text x="45" y="440.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#5d7080">Its removal was not reported. Do not infer fitted status from this simplified source-selection drawing.</text>
