<text x="1378" y="1058.84" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="white">3</text>
<text x="1300" y="1118.84" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="white">1</text>
<text x="1446" y="1118.84" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="white">2</text>
<text x="1555" y="1015.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1c3044">3 = Drain (single leg)</text>
<text x="1555" y="1061.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1c3044">1 = Gate (lower left)</text>
<text x="1555" y="1107.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1c3044">2 = Source (lower right)</text>
<text x="1245" y="1219.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#b13b35">Q1: S2 → LiPo+ / R1; D3 → R0 → SW2 BAT throw.</text>
<text x="1245" y="1263.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#136b9b">Q2: S2 → GND; G1 → A3; D3 → Q1 G1 / SW1 NO.</text>
<text x="1245" y="1309.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#136b9b">Q3 / R6 omitted. No C1, C2, old D1, R3 or R4.</text>
<text x="1245" y="1352.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#5d7080">Switch lug numbering is part-specific: identify COM/throws by continuity.</text>
<rect x="45" y="1445" width="1130" height="295" fill="#f7fafc" stroke="#526474" stroke-width="2"/>
<text x="70" y="1490.52" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#136b9b">EXPOSURE — A0 / A1 / A2</text>
<text x="70" y="1540.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#136b9b">LOW end: A0 / CN4.1 / PF5 (GPIO LOW)</text>
<text x="70" y="1589.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#136b9b">Wiper: A1 / CN4.2 → buffered PA9 / ADC1 channel 10</text>
<text x="70" y="1640.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#136b9b">HIGH end: A2 / CN4.3 / PF6 (GPIO supply)</text>
<text x="70" y="1688.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#5d7080">Diagnostic verified. Normal capture still uses fixed exposure.</text>
<text x="70" y="1724.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#5d7080">Keep A1 digital companion PC10 input / no pull.</text>
<rect x="1220" y="1445" width="1130" height="295" fill="#f7fafc" stroke="#526474" stroke-width="2"/>
<text x="1245" y="1490.52" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#136b9b">ASA → ANALOG GAIN — new knob</text>
<text x="1245" y="1540.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#136b9b">LOW end: GND (common return)</text>
<text x="1245" y="1589.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#136b9b">Wiper: A5 / CN4.6 → buffered PG15 / ADC1 channel 7</text>
<text x="1245" y="1640.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#136b9b">HIGH end: A4 / CN4.5 / PC12 (GPIO supply)</text>
<text x="1245" y="1687.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#5d7080">User-installed wiring; gain integration pending. PH2 input / no pull.</text>
<text x="1245" y="1725.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#5d7080">ASA calibration TBD; analog gain planned 1–8×, digital gain 1×.</text>
<polyline points="45,1780 2350,1780" fill="none" stroke="#526474" stroke-width="2"/>
<text x="45" y="1821.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#526474">COMMON GROUND</text>
<text x="335" y="1818.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526474">LiPo −, latch / ASA GND and CN5 pin 6; JS return if fitted. USB ground is common through the board.</text>
<text x="45" y="1865.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#b13b35">Keep all CN9 jumpers OUT and SB12 fitted; board D2 / R23 remain removed. No parallel target supply.</text>
<text x="45" y="1910.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#1c3044">New policy: A3 HIGH for battery capture; LOW after USB detection and throughout USB service / faults / shutdown.</text>
<text x="45" y="1951.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#5d7080">Before VBUS classification, early boot / UART recovery / E001 retain provisional HIGH. Not a zero-startup-pulse claim.</text>
<text x="45" y="1993.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#5d7080">SW2 USB bypasses the latch; unplug can cut power immediately. No guaranteed cleanup hold-up. No bench operation.</text>
<text x="45" y="2035.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#5d7080">A3 is exclusively HOLD. Do not run the old A3–A5 knob diagnostic; it would drive the latch and ASA wiper.</text>
</svg>