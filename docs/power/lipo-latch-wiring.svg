<text x="1795" y="692.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#5d7080">Actual rail voltage follows selected source</text>
<text x="1775" y="761.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#5d7080">Without JS, connect SW2 COM directly to CN5.5.</text>
<text x="1775" y="798.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#b13b35">R0 limits battery inrush only; USB bypasses it.</text>
<text x="1775" y="835.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#b13b35">No permanent electrical merge of the two sources.</text>
