<text x="62" y="642.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#136b9b">ENABLE CONTROL — functional blocks</text>
<text x="62" y="676.12" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#5d7080">Three independent ways to keep U6 enabled; they must not backfeed one another.</text>
<rect x="65" y="714" width="580" height="84" fill="white" stroke="#136b9b" stroke-width="2"/>
<text x="82" y="745.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#136b9b">SPDT + 2.2 µF startup pulse</text>
<text x="82" y="778.28" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7080">Positive pulse; held trigger does not give permanent enable</text>
<polyline points="645,756 710,756" fill="none" stroke="#136b9b" stroke-width="3"/>
<polyline points="699,749 710,756 699,763" fill="none" stroke="#136b9b" stroke-width="3"/>
