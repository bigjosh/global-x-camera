<text x="82" y="855.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#136b9b">PD7 HOLD — Arduino D9 / CN14.2</text>
<text x="82" y="888.28" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5d7080">MCU holds ON through capture, saving and recovery</text>
