<text x="789" y="879.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#136b9b">enable</text>
<text x="798" y="906.28" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#136b9b">OR</text>
<polyline points="710,866 750,866" fill="none" stroke="#136b9b" stroke-width="3"/>
<polyline points="905,866 990,866 990,510 1050,510" fill="none" stroke="#136b9b" stroke-width="3"/>
<text x="953" y="916.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#136b9b">EN</text>
<rect x="1050" y="675" width="810" height="370" fill="#f5f8fa" stroke="#526474" stroke-width="2"/>
<text x="1075" y="713.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#1c3044">Keep U6 and its useful support parts in place</text>
<text x="1075" y="761.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#136b9b">C18 = 10 nF: startup-ramp capacitor</text>
<text x="1075" y="799.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#1c3044">R7 = 3.9 kΩ: about 0.55 A nominal current limit</text>
<text x="1075" y="837.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#1c3044">R29 = 100 kΩ: default-OFF enable pull-down</text>
<text x="1075" y="875.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#1c3044">C15 = 10 µF: existing output capacitor</text>
<text x="1075" y="917.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#b13b35">Reuse C25 = 100 nF on the NEW isolated input.</text>
<text x="1075" y="956.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#5d7080">Rework must isolate ST-LINK input, enable, current-limit</text>
<text x="1075" y="989.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#5d7080">control and output-sense connections. Not a cut map.</text>
<text x="1075" y="1025.96" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#136b9b">No Q1/Q2 shutter latch in the qualified U6 version.</text>
<polyline points="40,1083 1860,1083" fill="none" stroke="#526474" stroke-width="2"/>
<text x="40" y="1120.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#526474">COMMON GROUND</text>
<text x="294" y="1120.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#526474">LiPo −, U6 ground, external controls, JS ground and CN5 pin 6.</text>
<text x="40" y="1164.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#136b9b">U6 replaces the master latch and is intended to replace R0 after startup qualification.</text>
<text x="40" y="1203.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#5d7080">No charger or voltage boost. Do not feed the target around U6. This drawing does not authorize unidentified trace cuts.</text>
</svg>