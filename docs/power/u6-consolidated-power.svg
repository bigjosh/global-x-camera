<title>Deferred alternative: consolidated camera power using existing Nucleo U6</title>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="58.239999999999995" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#1c3044">Consolidated camera power — reuse Nucleo U6</text>
<text x="40" y="102.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#136b9b">DEFERRED — discrete circuit preferred  |  November 8, 2026  |  Existing parts only</text>
<text x="40" y="140.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#5d7080">Power connections are shown; enable combining and exact PCB isolation cuts still need a detailed wiring plan.</text>
