<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190">
<title>Global X Camera: selected 5 V prototype power and 1.8 V NAND wiring</title>
<rect width="100%" height="100%" fill="white"/>
<text x="50" y="65.24" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#183047">Selected prototype wiring</text>
<text x="50" y="111.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#146a94">LTC output = 5.0 V  |  NAND and its five bus GPIOs = 1.8 V</text>
<text x="50" y="151.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#52687a">Connection diagram — use the assembly guide for actual board locations.</text>
<rect x="50" y="205" width="245" height="150" rx="6" fill="#f1f7fb" stroke="#146a94" stroke-width="2"/>
<text x="70" y="248.68" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#183047">4 × CR2032</text>
<text x="70" y="286.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#183047">Series pack</text>
<text x="70" y="326.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#52687a">Qualify pulse / sag</text>
<polyline points="295,280 360,280" fill="none" stroke="#146a94" stroke-width="4"/>
<rect x="360" y="205" width="260" height="150" rx="6" fill="#f1f7fb" stroke="#146a94" stroke-width="2"/>
<text x="380" y="248.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#183047">LTC3621 → 5.0 V</text>
<text x="380" y="291.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#183047">DC1863A: JP7 = 5 V</text>
<text x="380" y="331.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#52687a">JP1 ON for bring-up</text>
<polyline points="620,280 700,280" fill="none" stroke="#146a94" stroke-width="4"/>
<rect x="700" y="205" width="245" height="150" rx="6" fill="#f1f7fb" stroke="#146a94" stroke-width="2"/>
<text x="720" y="248.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#183047">JS110 (optional)</text>
<text x="720" y="295.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#183047">IN+ → OUT+</text>
<text x="720" y="331.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#52687a">5 V measurement</text>
<polyline points="945,280 1030,280" fill="none" stroke="#146a94" stroke-width="4"/>
<rect x="1030" y="205" width="515" height="205" rx="6" fill="#f1f7fb" stroke="#146a94" stroke-width="2"/>
<text x="1050" y="248.84" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#183047">NUCLEO target: CN9 pin 2</text>
<text x="1050" y="290.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#aa3737">All CN9 source shunts REMOVED</text>
<text x="1050" y="328.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#183047">CN8 USB and VIN disconnected</text>
<text x="1050" y="367.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#183047">Common GND: Arduino CN14 pin 7</text>
<polyline points="1275,410 1275,470" fill="none" stroke="#146a94" stroke-width="4"/>
<rect x="1030" y="470" width="515" height="168" rx="6" fill="#f1f7fb" stroke="#146a94" stroke-width="2"/>
<text x="1050" y="513.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#183047">Keep stock downstream regulators</text>
<text x="1050" y="553.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#183047">MCU main / AUX / core / 1.8 V</text>
<text x="1050" y="593.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#183047">Camera adapter and boot NOR</text>
<polyline points="1030,547 900,547 900,730" fill="none" stroke="#08766a" stroke-width="4"/>
<text x="640" y="518.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#08766a">CN12 pin 14: 1.8 V</text>
<rect x="50" y="440" width="530" height="198" rx="6" fill="#f7f8fa" stroke="#52687a" stroke-width="2"/>
<text x="70" y="481.84" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#183047">CN10 USB → ST-LINK debugger</text>
<text x="70" y="522.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#183047">Powered separately during development</text>
<text x="70" y="562.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#aa3737">Remove D2: open target → debugger feed</text>
<text x="70" y="602.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#52687a">Signal / sense links still cross this boundary</text>
<polyline points="580,547 630,547" fill="none" stroke="#52687a" stroke-width="4"/>
<polyline points="593,535 617,559" fill="none" stroke="#aa3737" stroke-width="4"/>
<polyline points="593,559 617,535" fill="none" stroke="#aa3737" stroke-width="4"/>
<text x="50" y="679.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#aa3737">Remove R23 to disconnect LD1 power LED. Ethernet: see load-trimming stage.</text>
<rect x="50" y="730" width="690" height="255" rx="6" fill="#f0f8f5" stroke="#08766a" stroke-width="2"/>
<text x="70" y="771.84" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#08766a">Arduino signals → Alliance 1.8 V NAND</text>
<text x="70" y="815.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#183047">D10 / CN14.3 → CS# (open-drain only)</text>
<text x="70" y="853.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#183047">A1 / CN4.2 → IO0       A4 / CN4.5 → IO1</text>
<text x="70" y="891.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#183047">D14 / CN14.9 → IO2    A5 / CN4.6 → IO3</text>
<text x="70" y="929.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#183047">D15 / CN14.10 → CLK; CN14.7 → GND</text>
<text x="70" y="966.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#08766a">CS#, IO2 and IO3: each 10 kΩ to NAND 1.8 V</text>
<rect x="800" y="730" width="745" height="255" rx="6" fill="#f0f8f5" stroke="#08766a" stroke-width="2"/>
<text x="820" y="771.84" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#08766a">1.8 V conversion and distribution</text>
<text x="820" y="816.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#aa3737">REMOVE SB24, R88 and R89 first</text>
<text x="820" y="852.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#183047">CN12.14 → CN3.10 → CN14.8 / AREF</text>
<text x="820" y="887.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#183047">CN14.8 → NAND pin 8 / VCC</text>
<text x="820" y="920.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#aa3737">R125 unfitted; label AREF 1.8 V</text>
<text x="820" y="951.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#183047">100 nF + ~1 µF at NAND VCC / GND</text>
<text x="820" y="979.96" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#aa3737">CN12.13 is NOT ground. Keep R104 fitted.</text>
<text x="50" y="1050.16" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#183047">Before power: verify supply isolation and 1.8 V wiring with a meter.</text>
<text x="50" y="1092.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#52687a">This rework does not implement NAND saving, RUN/HOLD or final shutdown firmware.</text>
<text x="50" y="1134.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#52687a">Main battery OFF current and debugger backfeed still require separate qualification.</text>
</svg>