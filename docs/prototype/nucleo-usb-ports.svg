<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 930" width="900" height="930" font-family="Helvetica, Arial, sans-serif">
<title>NUCLEO-N657X0-Q (MB1940): which USB-C port programs the camera</title>
<desc>Top view, to scale. CN10, the ST-LINK USB Type-C connector on the top edge right of centre next to two status LEDs, is the programming port. CN8, the USB Type-C connector marked USB on the bottom edge between the blue user button and the Ethernet jack, is the photo download port and must be unplugged for programming and whenever a photo is taken.</desc>
<style>
 .bg{fill:#ffffff} .board{fill:#eef1f4;stroke:#3d4852;stroke-width:2}
 .part{fill:#c9d1d9;stroke:#5b6670;stroke-width:1} .hdr{fill:#2f363d;stroke:#2f363d}
 .chip{fill:#59636e;stroke:#2f363d} .led{fill:#f2cc60;stroke:#7d6a1f}
 .go{fill:#1a7f37;stroke:#0f5323;stroke-width:2} .no{fill:#ffffff;stroke:#b3261e;stroke-width:3;stroke-dasharray:6 4}
 .blue{fill:#2f6fde;stroke:#1b3f80} .black{fill:#24292f;stroke:#000}
 .lbl{font-size:13px;fill:#24292f} .small{font-size:12px;fill:#57606a} .on{font-size:11px;fill:#ffffff;font-weight:bold}
 .head{font-size:19px;font-weight:bold;fill:#24292f} .gohead{font-size:16px;font-weight:bold;fill:#1a7f37}
 .nohead{font-size:16px;font-weight:bold;fill:#b3261e} .lead{stroke:#57606a;stroke-width:1} .golead{stroke:#1a7f37;stroke-width:2.5;fill:none}
 .nolead{stroke:#b3261e;stroke-width:2.5;fill:none} .edge{font-size:12px;fill:#57606a;letter-spacing:2px}
</style>
<rect class="bg" width="900" height="930"/>
<text x="450.0" y="30.0" class="head" text-anchor="middle">NUCLEO-N657X0-Q (MB1940), top view, to scale</text>
<rect x="285.0" y="125.0" width="350.0" height="666.75" rx="14" class="board"/>
<rect x="295.1" y="277.3" width="25.0" height="241.5" rx="2" class="hdr"/>
<rect x="599.9" y="277.3" width="25.0" height="241.5" rx="2" class="hdr"/>
<rect x="333.1" y="328.2" width="12.5" height="101.5" rx="2" class="hdr"/>
<rect x="333.1" y="442.6" width="12.5" height="76.0" rx="2" class="hdr"/>
<rect x="574.4" y="282.4" width="12.5" height="127.0" rx="2" class="hdr"/>
<rect x="574.4" y="417.1" width="12.5" height="101.5" rx="2" class="hdr"/>
<rect x="296.0" y="175.0" width="25.0" height="65.0" rx="2" class="hdr"/>
<rect x="540.2" y="173.4" width="89.0" height="25.0" rx="2" class="hdr"/>
<rect x="432.4" y="274.4" width="38.0" height="25.0" rx="2" class="hdr"/>
<rect x="384.8" y="260.9" width="12.5" height="38.0" rx="2" class="hdr"/>
<rect x="409.6" y="260.9" width="12.5" height="38.0" rx="2" class="hdr"/>
<rect x="412.9" y="180.0" width="50.0" height="50.0" rx="2" class="chip"/>
<rect x="420.0" y="416.8" width="70.0" height="70.0" rx="2" class="chip"/>
<text x="437.9" y="209.0" class="on" text-anchor="middle">ST-LINK</text>
<text x="455.0" y="455.8" class="on" text-anchor="middle">STM32N6</text>
<rect x="330.9" y="625.6" width="120.0" height="22.5" rx="2" class="part"/>
<rect x="479.4" y="710.8" width="82.5" height="82.5" rx="2" class="part"/>
<circle cx="328.8" cy="763.8" r="14" class="blue"/>
<circle cx="602.5" cy="762.55" r="12" class="black"/>
<circle cx="566.95" cy="147.24999999999994" r="4.5" class="led"/>
<circle cx="593.0" cy="147.24999999999994" r="4.5" class="led"/>
<circle cx="569.7" cy="687.6999999999999" r="4.5" class="led"/>
<circle cx="569.95" cy="674.3499999999999" r="4.5" class="led"/>
<circle cx="569.95" cy="661.0" r="4.5" class="led"/>
<rect x="476.9" y="125.0" width="45.0" height="37.5" rx="3" class="go"/>
<rect x="402.9" y="754.5" width="45.0" height="37.5" rx="3" class="no"/>
<line x1="275.0" y1="207.5" x2="296.0" y2="207.5" class="lead"/>
<text x="270.0" y="211.5" class="lbl" text-anchor="end">CN1 debug header (not used)</text>
<line x1="275.0" y1="279.9" x2="384.8" y2="279.9" class="lead"/>
<text x="270.0" y="283.9" class="lbl" text-anchor="end">JP1 / JP2 boot jumpers</text>
<line x1="275.0" y1="379.0" x2="333.1" y2="379.0" class="lead"/>
<text x="270.0" y="383.0" class="lbl" text-anchor="end">CN5: 5 V in (pin 5), GND (pin 6)</text>
<line x1="275.0" y1="480.6" x2="333.1" y2="480.6" class="lead"/>
<text x="270.0" y="484.6" class="lbl" text-anchor="end">CN4: A0–A5, both knobs</text>
<line x1="275.0" y1="636.9" x2="330.9" y2="636.9" class="lead"/>
<text x="270.0" y="640.9" class="lbl" text-anchor="end">CN6 camera ribbon</text>
<line x1="275.0" y1="763.8" x2="314.8" y2="763.8" class="lead"/>
<text x="270.0" y="767.8" class="lbl" text-anchor="end">B1 blue USER button</text>
<line x1="598.0" y1="147.2" x2="645.0" y2="147.2" class="lead"/>
<text x="650.0" y="151.2" class="lbl" text-anchor="start">LD4 / LD9 ST-LINK status LEDs</text>
<line x1="629.2" y1="185.9" x2="645.0" y2="185.9" class="lead"/>
<text x="650.0" y="189.9" class="lbl" text-anchor="start">CN12 header</text>
<line x1="586.9" y1="345.9" x2="645.0" y2="345.9" class="lead"/>
<text x="650.0" y="349.9" class="lbl" text-anchor="start">CN14: D8 (pin 1) = power HOLD</text>
<line x1="586.9" y1="467.9" x2="645.0" y2="467.9" class="lead"/>
<text x="650.0" y="471.9" class="lbl" text-anchor="start">CN13: D0–D7</text>
<line x1="575.0" y1="674.3" x2="645.0" y2="674.3" class="lead"/>
<text x="650.0" y="678.3" class="lbl" text-anchor="start">LD5 / LD6 / LD7 red, green, blue</text>
<line x1="561.9" y1="724.2" x2="645.0" y2="724.2" class="lead"/>
<text x="650.0" y="728.2" class="lbl" text-anchor="start">CN11 Ethernet jack</text>
<line x1="614.5" y1="762.5" x2="645.0" y2="762.5" class="lead"/>
<text x="650.0" y="766.5" class="lbl" text-anchor="start">B2 black RESET button</text>
<polyline points="499.4,125.0 499.4,91.0 372,91.0" class="golead"/>
<text x="20.0" y="85.0" class="gohead" text-anchor="start">PROGRAM HERE: CN10, “ST-LINK” USB-C</text>
<text x="20.0" y="103.0" class="small" text-anchor="start">cable from here to the PC that runs the programmer</text>
<text x="515.4" y="113.0" class="edge" text-anchor="start">TOP EDGE</text>
<polyline points="425.35,792.0 425.35,832.0 330,832.0" class="nolead"/>
<text x="20.0" y="826.0" class="nohead" text-anchor="start">NOT THIS ONE: CN8, marked “USB”</text>
<text x="20.0" y="844.0" class="small" text-anchor="start">photo download only; leave it unplugged while</text>
<text x="20.0" y="859.0" class="small" text-anchor="start">programming and whenever you take a photo</text>
<text x="520.6" y="756.0" class="small" text-anchor="middle">RJ45</text>
<text x="441.4" y="810.0" class="edge" text-anchor="start">BOTTOM EDGE</text>
</svg>
