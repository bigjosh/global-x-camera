<text x="45" y="1048.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#b13b35">C1, C2 and D1 omitted by choice. No independent shutdown off-delay.</text>
<rect x="1030" y="445" width="725" height="355" fill="#f5f8fa" stroke="#526474" stroke-width="2"/>
<text x="1055" y="483.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#1c3044">Both MOSFETs: SOT-23, TOP VIEW</text>
<text x="1055" y="518.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#5d7080">Marking side up; single leg at the top.</text>
<rect x="1115" y="565" width="190" height="90" fill="#263947" stroke="#1c3044" stroke-width="2"/>
<rect x="1190" y="538" width="40" height="27" fill="#c5ced4" stroke="#526474" stroke-width="2"/>
<rect x="1125" y="655" width="40" height="27" fill="#c5ced4" stroke="#526474" stroke-width="2"/>
<rect x="1255" y="655" width="40" height="27" fill="#c5ced4" stroke="#526474" stroke-width="2"/>
<text x="1360" y="579.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1c3044">3 = Drain (single leg)</text>
<text x="1360" y="625.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1c3044">1 = Gate (lower left)</text>
<text x="1360" y="671.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1c3044">2 = Source (lower right)</text>
<text x="1198" y="589.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="white">3</text>
<text x="1128" y="640.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="white">1</text>
<text x="1271" y="640.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="white">2</text>
<text x="1055" y="733.64" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1c3044">Q1: source to VBAT. Q2: source to GND.</text>
<text x="1055" y="770.12" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#5d7080">Left blocks show connections, not package orientation.</text>
<text x="1030" y="859.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#136b9b">PRESS: discharged C3 pulls Q1 gate low.</text>
<text x="1030" y="898.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#136b9b">HOLD HIGH: Q2 keeps Q1 gate low.</text>
<text x="1030" y="937.32" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#136b9b">RELEASE HOLD: R2 turns Q2 off.</text>
<text x="1030" y="973.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#5d7080">If SW1 stays pressed, C3 charges and Q1 turns off.</text>
<text x="1030" y="1007.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#5d7080">If SW1 is released, Q1 turns off without C3 delay.</text>
<text x="1030" y="1041.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#b13b35">A short tap must still last through GPIO takeover.</text>
<polyline points="45,1090 1755,1090" fill="none" stroke="#526474" stroke-width="2"/>
<text x="45" y="1129.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#526474">COMMON GROUND</text>
<text x="310" y="1129.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526474">LiPo negative + JS ground + Arduino CN5 pin 6 + latch GND. No CN15 / TP19 connection.</text>
<text x="45" y="1171.48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#1c3044">Hold PD7 HIGH through capture, save and recovery; float it immediately before Standby.</text>
<text x="45" y="1206.8" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#5d7080">Use one target supply: no CN9 shunts, CN8 or VIN feed. LiPo headroom and shutdown sequencing remain unqualified.</text>
</svg>