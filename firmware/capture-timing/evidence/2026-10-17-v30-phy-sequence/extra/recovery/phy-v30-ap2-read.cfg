source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter serial 002100203335511035383531
adapter speed 1000
reset_config none
gdb_port disabled
tcl_port disabled
telnet_port disabled
swd newdap n6 cpu -irlen 4
dap create n6.dap -chain-position n6.cpu
init
puts "AP2_IDR=[st-link cmd 8 0xF2 0x45 0x02 0x00 0xFC 0x00]"
puts "AP2_CSW=[st-link cmd 8 0xF2 0x45 0x02 0x00 0x00 0x00]"
puts "AP2_TAR=[st-link cmd 8 0xF2 0x45 0x02 0x00 0x04 0x00]"
puts "DP_CTRL_STAT=[st-link cmd 8 0xF2 0x45 0xFF 0xFF 0x04 0x00]"
shutdown
