source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter serial 002100203335511035383531
adapter speed 1000
reset_config none
gdb_port disabled
tcl_port disabled
telnet_port disabled
swd newdap n6 cpu -irlen 4
dap create n6.dap -chain-position n6.cpu
init
set status [st-link cmd 2 0xF2 0x4B 0x02 0x00]
puts "AP2_INIT=$status"
if {[lindex $status 0] != 0x80} { error "AP2 not opened" }
puts "TRACE=[st-link cmd 32 0xF2 0x07 0x00 0x00 0x3F 0x34 0x20 0x00 0x02 0x60 0x00 0x10]"
puts "TRACE_STATUS=[st-link cmd 12 0xF2 0x3E]"
puts "LATE=[st-link cmd 128 0xF2 0x07 0x00 0x80 0x3F 0x34 0x80 0x00 0x02 0x60 0x00 0x10]"
puts "LATE_STATUS=[st-link cmd 12 0xF2 0x3E]"
puts "RCC_CLOCK=[st-link cmd 8 0xF2 0x07 0x20 0x80 0x02 0x56 0x08 0x00 0x02 0x60 0x00 0x10]"
puts "RCC_CLOCK_STATUS=[st-link cmd 12 0xF2 0x3E]"
puts "AP1_INIT=[st-link cmd 2 0xF2 0x4B 0x01 0x00]"
shutdown
