source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter serial 002100203335511035383531
adapter speed 1000
reset_config srst_only srst_nogate
gdb_port disabled
tcl_port disabled
telnet_port disabled
swd newdap n6 cpu -irlen 4
dap create n6.dap -chain-position n6.cpu
init
catch {
    adapter assert srst
    sleep 100
    puts "DP_CTRLSTAT=[st-link cmd 8 0xF2 0x45 0xFF 0xFF 0x04 0x00]"
    set status [st-link cmd 2 0xF2 0x4B 0x02 0x00]
    puts "RESET_AP2_INIT=$status"
    if {[lindex $status 0] == 0x80} {
        puts "RESET_RCC_BYTES=[st-link cmd 4 0xF2 0x07 0x3C 0x82 0x02 0x56 0x04 0x00 0x02 0x60 0x00 0x10]"
        puts "RESET_READ_STATUS=[st-link cmd 12 0xF2 0x3E]"
    }
} err
puts "PROBE_RESULT=$err"
adapter deassert srst
shutdown
