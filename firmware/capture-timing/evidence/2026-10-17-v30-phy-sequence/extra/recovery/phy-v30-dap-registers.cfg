source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter serial 002100203335511035383531
adapter speed 1000
reset_config none
gdb_port disabled
tcl_port disabled
telnet_port disabled
swd newdap n6 cpu -irlen 4
dap create n6.dap -chain-position n6.cpu
init
puts "AP1_IDR=[n6.dap apreg 1 0xfc]"
catch {puts "AP0_IDR=[n6.dap apreg 0 0xfc]"} err
puts "AP0_IDR_RESULT=$err"
catch {puts "AP0_CSW=[n6.dap apreg 0 0x00]"} err
puts "AP0_CSW_RESULT=$err"
catch {puts "AP1_CSW=[n6.dap apreg 1 0x00]"} err
puts "AP1_CSW_RESULT=$err"
catch {puts "AP1_CFG=[n6.dap apreg 1 0xf4]"} err
puts "AP1_CFG_RESULT=$err"
catch {puts "AP1_BASE=[n6.dap apreg 1 0xf8]"} err
puts "AP1_BASE_RESULT=$err"
shutdown
