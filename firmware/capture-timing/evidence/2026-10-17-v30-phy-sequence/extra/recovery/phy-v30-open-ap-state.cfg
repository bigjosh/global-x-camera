source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter serial 002100203335511035383531
adapter speed 1000
reset_config none
gdb_port disabled
tcl_port disabled
telnet_port disabled
swd newdap n6 cpu -irlen 4
dap create n6.dap -chain-position n6.cpu
init
puts "AP1_INIT=[st-link cmd 2 0xF2 0x4B 0x01 0x00]"
puts "AP1_CSW=[st-link cmd 8 0xF2 0x45 0x01 0x00 0x00 0x00]"
puts "AP2_INIT=[st-link cmd 2 0xF2 0x4B 0x02 0x00]"
puts "AP2_CSW=[st-link cmd 8 0xF2 0x45 0x02 0x00 0x00 0x00]"
puts "AP2_RSTR=[st-link cmd 4 0xF2 0x07 0x3C 0x82 0x02 0x56 0x04 0x00 0x02 0x60 0x00 0x10]"
puts "AP2_STATUS=[st-link cmd 12 0xF2 0x3E]"
shutdown
